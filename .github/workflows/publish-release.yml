name: Publish requested GitHub release

'on':
  workflow_dispatch:
  push:
    branches: [main]
    paths: ['release-request.json']

permissions:
  contents: write
  actions: read

concurrency:
  group: publish-requested-release
  cancel-in-progress: false

jobs:
  publish:
    runs-on: windows-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - name: Verify successful main build and pinned artifact
        id: source
        uses: actions/github-script@v7
        with:
          script: |
            const fs = require('fs');
            const m = JSON.parse(fs.readFileSync('release-request.json', 'utf8'));
            if (!/^v\d+\.\d+\.\d+$/.test(m.tag_name) || !/^[a-f0-9]{40}$/.test(m.source_commit))
              throw new Error('Invalid release identity');
            if (!Number.isSafeInteger(m.source_run_id) || !Number.isSafeInteger(m.artifact_id))
              throw new Error('Invalid build reference');
            if (!/^[a-f0-9]{64}$/.test(m.manifest_sha256 || ''))
              throw new Error('A pinned release-manifest.json SHA-256 is required');
            const repo = context.repo;
            const {data: run} = await github.rest.actions.getWorkflowRun({...repo, run_id: m.source_run_id});
            if (run.conclusion !== 'success' || run.status !== 'completed' || run.head_branch !== 'main' ||
                run.event !== 'push' || run.head_sha !== m.source_commit || run.path !== '.github/workflows/windows-build.yml')
              throw new Error('Source is not the requested successful main Windows build');
            const {data: artifacts} = await github.rest.actions.listWorkflowRunArtifacts({...repo, run_id: m.source_run_id});
            const artifact = artifacts.artifacts.find(a => a.id === m.artifact_id);
            if (!artifact || artifact.expired || artifact.name !== 'AutelVysor-windows-x64')
              throw new Error('Pinned Windows artifact unavailable');
            core.setOutput('run_id', String(m.source_run_id));
            core.setOutput('version', m.tag_name.slice(1));
            core.setOutput('source_commit', m.source_commit);
      - uses: actions/download-artifact@v4
        with:
          name: AutelVysor-windows-x64
          path: release-artifacts
          github-token: ${{ github.token }}
          run-id: ${{ steps.source.outputs.run_id }}
      - name: Verify pinned manifest, packages and declared signing mode before release mutation
        shell: powershell
        env:
          AUTEL_SIGN_CERT_THUMBPRINT: ${{ vars.AUTEL_SIGN_CERT_THUMBPRINT }}
        run: |
          $ErrorActionPreference = 'Stop'
          $request = Get-Content release-request.json -Raw | ConvertFrom-Json
          $manifestHash = (Get-FileHash release-artifacts/release-manifest.json -Algorithm SHA256).Hash.ToLowerInvariant()
          if ($manifestHash -cne $request.manifest_sha256) { throw 'Pinned release manifest SHA-256 mismatch.' }
          .\scripts\verify-release.ps1 -ArtifactDirectory release-artifacts -ExpectedVersion '${{ steps.source.outputs.version }}' -ExpectedSourceCommit '${{ steps.source.outputs.source_commit }}' -ExpectedSourceRunId '${{ steps.source.outputs.run_id }}'
      - name: Check hashes, stage assets, then publish release
        uses: actions/github-script@v7
        with:
          script: |
            const fs = require('fs');
            const path = require('path');
            const crypto = require('crypto');
            const m = JSON.parse(fs.readFileSync('release-request.json', 'utf8'));
            const repo = context.repo;
            const sha = bytes => crypto.createHash('sha256').update(bytes).digest('hex');
            const manifestBytes = fs.readFileSync(path.join('release-artifacts', 'release-manifest.json'));
            if (sha(manifestBytes) !== m.manifest_sha256) throw new Error('Manifest changed after trust verification');
            const manifest = JSON.parse(manifestBytes.toString('utf8').replace(/^\uFEFF/, ''));
            if (!['signed-release', 'unsigned-internal'].includes(manifest.releaseMode)) throw new Error('Unsupported signing mode');
            const releaseNotes = m.notes + (manifest.releaseMode === 'unsigned-internal'
              ? '\n\nSigning status: UNSIGNED. No trusted publisher signature; Windows may show an unknown publisher warning.'
              : '\n\nSigning status: trusted publisher and timestamp verified.');
            fs.mkdirSync('release-assets', {recursive: true});
            if (!Array.isArray(m.files) || m.files.length !== 2) throw new Error('Expected ZIP and installer');
            const files = m.files.map(f => {
              if (path.basename(f.source) !== f.source || path.basename(f.name) !== f.name ||
                  !/^AutelVysor-[A-Za-z0-9.-]+\.(zip|exe)$/.test(f.name) || !/^[a-f0-9]{64}$/.test(f.sha256))
                throw new Error('Invalid release asset');
              const expectedSources = ['AutelVysor-v' + manifest.version + '-windows-x64.zip', 'AutelVysor-Setup.exe'];
              if (!expectedSources.includes(f.source)) throw new Error('Unexpected package source');
              const evidence = manifest.files.find(e => e.path === f.source);
              if (!evidence || evidence.sha256 !== f.sha256) throw new Error('Request differs from post-signing manifest');
              const bytes = fs.readFileSync(path.join('release-artifacts', f.source));
              if (sha(bytes) !== f.sha256) throw new Error('SHA-256 mismatch: ' + f.source);
              const local = path.join('release-assets', f.name);
              fs.writeFileSync(local, bytes);
              return {...f, local, size: bytes.length};
            });
            if (new Set(files.map(f => f.source)).size !== 2 || new Set(files.map(f => f.name)).size !== 2)
              throw new Error('Expected distinct portable ZIP and installer');
            const manifestLocal = path.join('release-assets', 'release-manifest.json');
            fs.writeFileSync(manifestLocal, manifestBytes);
            files.push({name: 'release-manifest.json', local: manifestLocal, size: manifestBytes.length, sha256: sha(manifestBytes)});
            const sums = Buffer.from(files.map(f => f.sha256 + '  ' + f.name).join('\n') + '\n');
            const sumsPath = path.join('release-assets', 'SHA256SUMS.txt');
            fs.writeFileSync(sumsPath, sums);
            files.push({name: 'SHA256SUMS.txt', local: sumsPath, size: sums.length, sha256: sha(sums)});
            // Create the immutable version tag before creating/publishing a draft.
            try { await github.rest.git.getRef({...repo, ref: 'tags/' + m.tag_name}); }
            catch (e) {
              if (e.status !== 404) throw e;
              await github.rest.git.createRef({...repo, ref: 'refs/tags/' + m.tag_name, sha: m.source_commit});
            }
            const {data: tagged} = await github.rest.repos.getCommit({...repo, ref: m.tag_name});
            if (tagged.sha !== m.source_commit) throw new Error('Release tag points to another commit');
            // Listing also finds a draft left by an interrupted publish attempt.
            const releases = await github.paginate(github.rest.repos.listReleases, repo);
            let release = releases.find(r => r.tag_name === m.tag_name);
            if (release && !release.draft) throw new Error('Existing public releases are immutable; create a new version');
            if (release && release.draft && release.target_commitish !== m.source_commit)
              throw new Error('Existing draft targets another commit');
            if (!release) {
              release = (await github.rest.repos.createRelease({...repo, tag_name: m.tag_name,
                target_commitish: m.source_commit, name: m.name, body: releaseNotes, draft: true, prerelease: false})).data;
            }
            let assets = await github.paginate(github.rest.repos.listReleaseAssets, {...repo, release_id: release.id});
            const expectedAssets = new Set(files.map(f => f.name));
            if (assets.some(a => !expectedAssets.has(a.name))) throw new Error('Draft contains unexpected unverified assets');
            for (const f of files) {
              const existing = assets.find(a => a.name === f.name);
              if (existing) {
                if (existing.state === 'uploaded' && existing.size === f.size && existing.digest === 'sha256:' + f.sha256) continue;
                if (!release.draft) throw new Error('Published asset differs: ' + f.name);
                await github.rest.repos.deleteReleaseAsset({...repo, asset_id: existing.id});
              }
              const {data: asset} = await github.rest.repos.uploadReleaseAsset({...repo, release_id: release.id,
                name: f.name, data: fs.readFileSync(f.local),
                headers: {'content-type': 'application/octet-stream', 'content-length': f.size}});
              if (asset.state !== 'uploaded' || asset.size !== f.size || asset.digest !== 'sha256:' + f.sha256)
                throw new Error('Uploaded asset verification failed: ' + f.name);
            }
            assets = await github.paginate(github.rest.repos.listReleaseAssets, {...repo, release_id: release.id});
            if (assets.length !== files.length || files.some(f => !assets.some(a => a.name === f.name &&
                a.state === 'uploaded' && a.size === f.size && a.digest === 'sha256:' + f.sha256)))
              throw new Error('Final release asset set does not match verified packages and manifest');
            await github.rest.repos.updateRelease({...repo, release_id: release.id, name: m.name, body: releaseNotes,
              draft: false, prerelease: false, make_latest: 'true'});
            core.notice('Published ' + release.html_url);
