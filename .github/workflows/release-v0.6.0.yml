name: Publish v0.6.0 Release

on:
  push:
    branches: [ main ]
    paths:
      - 'release-trigger-v0.6.0.txt'

permissions:
  contents: write
  actions: read

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - name: Download verified Windows build artifact
        uses: actions/download-artifact@v4
        with:
          name: AutelVysor-windows-x64
          path: release-assets
          github-token: ${{ secrets.GITHUB_TOKEN }}
          run-id: 39476194874

      - name: Inspect release assets
        shell: bash
        run: |
          set -euxo pipefail
          find release-assets -maxdepth 2 -type f -printf '%p %s bytes\n'
          test -f release-assets/AutelVysor-v0.6.0-windows-x64.zip
          test -f release-assets/AutelVysor-Setup.exe
          mv release-assets/AutelVysor-Setup.exe release-assets/AutelVysor-Setup-v0.6.0.exe
          sha256sum release-assets/AutelVysor-Setup-v0.6.0.exe release-assets/AutelVysor-v0.6.0-windows-x64.zip | tee release-assets/SHA256SUMS.txt

      - name: Verify expected SHA-256
        shell: bash
        run: |
          set -euxo pipefail
          echo "2821ee0aaa15c7aa7acf2138a32cccf3b67e8e605b45101c14d0728f5604eb54  release-assets/AutelVysor-Setup-v0.6.0.exe" | sha256sum -c -
          echo "943d6d42a52d63704193515311a6b15c120a06870c0c7b8090650cec73ddfbb1  release-assets/AutelVysor-v0.6.0-windows-x64.zip" | sha256sum -c -

      - name: Write release notes
        shell: bash
        run: |
          cat > RELEASE_NOTES.md <<'EOF'
          ## Autel Vysor v0.6.0

          Windows Android mirror/control client for Windows 10/11 x64 and Android 4.4+.

          ### Highlights
          - Windows 10/11 x64 self-contained build.
          - Android 4.4 / API 19 optional minicap acceleration with automatic ADB screenshot fallback.
          - Android 5.0+ embedded scrcpy mirroring/control.
          - Smooth / Standard / High mirror quality presets.
          - Audio forwarding toggle and clipboard synchronization toggle.
          - USB and Wi-Fi ADB, Android 11+ wireless pairing, multi-device tabs and reconnect.
          - APK install, file push/pull, screenshots and Android 5.0+ MP4 recording.
          - FileDescription: Autel
          - ProductName: Autel Vysor
          - FileVersion: 0.6.0.0

          ### Downloads
          - AutelVysor-Setup-v0.6.0.exe — installer
          - AutelVysor-v0.6.0-windows-x64.zip — portable package
          - SHA256SUMS.txt — checksums

          ### Validation
          GitHub Actions Windows build, packaged EXE self-test, metadata validation, portable ZIP creation and Inno Setup packaging passed. Physical Android device compatibility—especially Android 4.4 vendor ROMs—still requires device testing, so this release is marked as a pre-release.
          EOF

      - name: Publish GitHub pre-release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        shell: bash
        run: |
          set -euxo pipefail
          gh release create v0.6.0 \
            release-assets/AutelVysor-Setup-v0.6.0.exe \
            release-assets/AutelVysor-v0.6.0-windows-x64.zip \
            release-assets/SHA256SUMS.txt \
            --repo "${GITHUB_REPOSITORY}" \
            --target "6ca6ab7ddcefc1bcac1deeaab81b7d9ef1d09a0b" \
            --title "Autel Vysor v0.6.0" \
            --notes-file RELEASE_NOTES.md \
            --prerelease
