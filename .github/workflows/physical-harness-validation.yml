name: Physical harness validation (NO real devices)

on:
  pull_request:
    paths:
      - 'scripts/run-physical-*.ps1'
      - 'scripts/run-company-adb-e2e.ps1'
      - 'tests/AndroidFixture/**'
      - 'tests/CompanyAdbHarness/**'
      - '.github/workflows/physical-*.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  script-syntax:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - name: Parse PowerShell physical-device and GUI harness
        shell: powershell
        run: |
          $files = @(
            '.\scripts\run-physical-device-tests.ps1',
            '.\scripts\run-physical-gui-tests.ps1',
            '.\scripts\run-company-adb-e2e.ps1'
          )
          foreach ($file in $files) {
            $tokens = $null
            $errors = $null
            [System.Management.Automation.Language.Parser]::ParseFile(
              (Resolve-Path $file).Path,
              [ref]$tokens,
              [ref]$errors
            ) | Out-Null
            if ($errors.Count -gt 0) {
              $errors | Format-Table -AutoSize | Out-String | Write-Host
              throw "PowerShell parser rejected $file"
            }
            Write-Host "PASS PowerShell syntax: $file"
          }

      - name: Smoke-test corporate PowerShell runner with mock ADB (NOT real devices)
        shell: powershell
        run: |
          $ErrorActionPreference = 'Stop'
          $env:AUTEL_FAKE_ADB_STATE = Join-Path $env:RUNNER_TEMP 'autel-fake-adb-state'
          $out = Join-Path $env:RUNNER_TEMP 'autel-company-adb-report'
          & .\scripts\run-company-adb-e2e.ps1 -AdbPath '.\tests\CompanyAdbHarness\fake-adb.ps1' -OutputRoot $out
          if ($LASTEXITCODE -ne 0) { throw "Corporate harness self-test failed with exit $LASTEXITCODE." }
          $report = Get-Content (Join-Path $out 'summary.json') -Raw | ConvertFrom-Json
          if ([int]$report.Counts.FAIL -ne 0 -or [int]$report.Counts.PASS -lt 10) {
            throw "Corporate harness result count invalid: $($report.Counts | Out-String)"
          }
          if ([int]$report.Counts.BLOCKED_POLICY -lt 10) {
            throw "Corporate harness must not mark WPF/scrcpy as PASS in ADB-only mode."
          }
          if (-not (Test-Path (Join-Path $out 'report.html'))) { throw 'HTML report missing.' }
          if (-not (Test-Path (Join-Path $out 'results.csv'))) { throw 'CSV report missing.' }
          $cleanups = Get-Content (Join-Path $env:AUTEL_FAKE_ADB_STATE 'cleanups.txt')
          if (-not (@($cleanups | Where-Object { $_ -match 'autel-vysor-' }).Count -ge 2)) {
            throw 'Temporary remote file cleanup was not called.'
          }
          Write-Host 'PASS: Offline-only harness logic, report generation and cleanup.'
          Write-Host 'NOT A REAL ANDROID DEVICE TEST.'

  build-android-fixture:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - name: Install Android compile SDK from preinstalled Ubuntu Android command-line tools
        shell: bash
        run: |
          set -euxo pipefail
          SDK="${ANDROID_SDK_ROOT:-/usr/local/lib/android/sdk}"
          TOOL="$(find "$SDK/cmdline-tools" -name sdkmanager -type f | sort -V | tail -n1)"
          test -x "$TOOL"
          "$TOOL" "platforms;android-35" "build-tools;35.0.0"
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.10.2'
      - name: Compile disposable real-device Android test fixture
        run: gradle -p tests/AndroidFixture :app:assembleDebug --no-daemon
      - uses: actions/upload-artifact@v4
        with:
          name: AutelVysor-physical-android-fixture
          path: tests/AndroidFixture/app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
