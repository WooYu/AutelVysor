name: Publish v0.10.1 Release

on:
  push:
    branches: [main]
    paths:
      - 'release-trigger-v0.10.1.txt'

permissions:
  contents: write
  actions: read

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - name: Download validated main Windows build
        uses: actions/download-artifact@v4
        with:
          name: AutelVysor-windows-x64
          path: release-assets
          github-token: ${{ secrets.GITHUB_TOKEN }}
          run-id: 39555472740

      - name: Prepare release assets and checksums
        shell: bash
        run: |
          set -euxo pipefail
          find release-assets -maxdepth 2 -type f -printf '%p %s bytes\n'
          test -f release-assets/AutelVysor-v0.10.1-windows-x64.zip
          test -f release-assets/AutelVysor-Setup.exe
          mv release-assets/AutelVysor-Setup.exe release-assets/AutelVysor-Setup-v0.10.1.exe
          (cd release-assets && sha256sum AutelVysor-Setup-v0.10.1.exe AutelVysor-v0.10.1-windows-x64.zip > SHA256SUMS.txt)
          cat release-assets/SHA256SUMS.txt

      - name: Write release notes
        shell: bash
        run: |
          cat > RELEASE_NOTES.md <<'EOF'
          ## Autel Vysor v0.10.1

          This release merges PR #1 (the earlier v0.9.1 rotation/UI responsiveness work)
          into the v0.10.0 Android debugging workstation. It preserves all v0.10.0
          Device Debug, Unicode helper, batch APK/shell, audio diagnostics, network tools,
          capture-history, bugreport and update-check features.

          ### Changes
          - Fix embedded scrcpy native-window cropping after repeated real-device rotation.
          - Add guarded natural/landscape rotation toggles and return to Fit view.
          - Improve dark device-list, tab, dropdown, button and focused/selected control contrast.
          - Cache Android metadata to reduce repeated ADB scans and avoid needless device-list rebuilding.
          - Move legacy Android capture/decode work off the WPF UI thread, respecting cancellation.
          - Add Windows regression tests for repeated resizing, orientation toggles,
            metadata invalidation after reconnection and dark UI selection.

          ### Tested
          - Integration: PR #1 merged into main (merge commit 87c3be6633097e4b1460297027466f1e59a50fa9).
          - GitHub Actions Windows Build #48: regression-tests PASS, build PASS,
            packaged EXE self-test PASS, installer PASS, portable ZIP PASS.
          - FileDescription: Autel; ProductName: Autel Vysor; FileVersion: 0.10.1.0.

          ### Downloads
          - AutelVysor-Setup-v0.10.1.exe: Windows 10/11 x64 installer.
          - AutelVysor-v0.10.1-windows-x64.zip: Windows 10/11 x64 portable build.
          - SHA256SUMS.txt: individual SHA-256 checksums for both binaries.

          ### Important limitations
          **Unsigned internal test build.** A trusted Authenticode certificate has not yet
          been configured. Windows SmartScreen may warn about the installer.
          Real Android 4.4 vendor ROM behavior, Bluetooth routing, real device touch/rotation,
          and Windows 10/11 desktop GUI still require physical hardware verification.
          Therefore this version is marked **Pre-release**.
          EOF

      - name: Publish tagged GitHub pre-release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        shell: bash
        run: |
          set -euxo pipefail
          gh release create v0.10.1 \
            release-assets/AutelVysor-Setup-v0.10.1.exe \
            release-assets/AutelVysor-v0.10.1-windows-x64.zip \
            release-assets/SHA256SUMS.txt \
            --repo "${GITHUB_REPOSITORY}" \
            --target "87c3be6633097e4b1460297027466f1e59a50fa9" \
            --title "Autel Vysor v0.10.1" \
            --notes-file RELEASE_NOTES.md \
            --prerelease
